name: Collect deals

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Collect deals
        run: python scripts/collect.py

      - name: Save collected data
        run: |
          git config user.name "dealhub-bot"
          git config user.email "dealhub-bot@users.noreply.github.com"
          git add data/deals.json data/history.json
          git diff --cached --quiet || git commit -m "Update DealHub data"
          git push
