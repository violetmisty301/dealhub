<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DealHub</title><link rel="stylesheet" href="style.css"></head><body>
<header><a class="brand" href="./"><i>🔥</i><span><b>DealHub</b><small>나만의 핫딜 레이더</small></span></a><div id="updated">수집 데이터 확인 중</div></header>
<main><section class="hero"><div><span class="eyebrow">DEAL DASHBOARD</span><h1>좋은 딜만 빠르게<br><em>골라보세요.</em></h1><p>커뮤니티 핫딜을 한 곳에서 모아보고 가격을 비교합니다.</p></div><div class="stats"><div><small>수집 딜</small><b id="count">0</b></div><div><small>가격 확인</small><b id="priced">0</b></div><div><small>최저가 후보</small><b id="record">0</b></div></div></section>
<section class="toolbar"><div class="search">⌕ <input id="q" placeholder="상품명·쇼핑몰 검색"></div><div class="chips"><button class="active" data-filter="all">전체</button><button data-filter="record">🔥 최저가</button><button data-filter="priced">₩ 가격확인</button><button data-filter="new">🆕 최신</button></div><div class="selects"><select id="source"><option value="">모든 출처</option><option value="퀘이사존">퀘이사존</option><option value="뽐뿌">뽐뿌</option></select><select id="category"><option value="">모든 카테고리</option></select><select id="sort"><option value="new">최신순</option><option value="low">낮은 가격순</option><option value="high">높은 가격순</option></select></div></section>
<div class="heading"><div><h2>실시간 딜</h2><span id="resultCount"></span></div><small>DealHub 관측 데이터 기준</small></div><section id="deals" class="deals"><div class="empty">불러오는 중…</div></section><p class="note">※ 가격 평가는 DealHub가 누적한 관측 이력 기준이며 인터넷 전체의 절대 역대가를 의미하지 않습니다.</p></main><script src="app.js"></script></body></html>
