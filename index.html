<!doctype html><html lang='ko'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>DealHub</title><link rel='stylesheet' href='style.css'></head><body><header><div><h1>🔥 DealHub</h1><p>개인용 핫딜 통합 대시보드</p></div><span class='status'>● DEMO</span></header><main><section class='hero'><div><b>오늘의 핫딜</b><strong id='count'>0</strong><small>수집된 딜</small></div><div><b>🔥 역대가</b><strong id='recordCount'>0</strong><small>관측 최저가</small></div><div><b>⭐ 관심상품</b><strong id='watchCount'>0</strong><small>키워드 일치</small></div></section><section class='toolbar'><input id='search' placeholder='상품명, 쇼핑몰 검색'><select id='source'><option value=''>전체 사이트</option><option>뽐뿌</option><option>퀘이사존</option><option>루리웹</option><option>FM코리아</option></select><select id='rating'><option value=''>전체 가격등급</option><option>역대가</option><option>역대가 근접</option><option>핫딜</option><option>좋은 가격</option></select></section><section class='chips'><button class='active' data-cat=''>전체</button><button data-cat='PC'>💻 PC</button><button data-cat='모바일'>📱 모바일</button><button data-cat='게임'>🎮 게임</button><button data-cat='식품'>🍔 식품</button><button data-cat='생활'>📦 생활</button></section><section class='notice'>현재는 <b>GitHub Pages 작동 확인용 DEMO</b>입니다. 화면이 정상적으로 열리면 다음 단계에서 실제 자동수집을 연결합니다.</section><section id='deals' class='grid'></section></main><script src='app.js'></script></body></html>
